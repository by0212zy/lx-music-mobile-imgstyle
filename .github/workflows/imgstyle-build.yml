name: Build Image Style APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare debug signing config
        run: printf 'storeFile=debug.keystore\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' > android/keystore.properties

      - name: Build release APK
        env:
          DISABLE_SVG: 1
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/*.apk apk-out/ || true
          ls -lh apk-out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-imgstyle-apk
          path: apk-out/*.apk
          if-no-files-found: error
